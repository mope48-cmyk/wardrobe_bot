services:
  bot:
    build: .
    image: wardrobe-bot:latest
    container_name: wardrobe-bot
    restart: unless-stopped
    env_file: .env
    environment:
      # Перекрывает DATABASE_URL из .env: БД лежит в томе wardrobe_data
      DATABASE_URL: sqlite+aiosqlite:////app/data/wardrobe.db
    volumes:
      - wardrobe_data:/app/data
      # Кэш весов MobileCLIP, чтобы не качать их при каждом пересоздании контейнера
      - hf_cache:/home/user/.cache/huggingface
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  admin:
    build: .
    image: wardrobe-bot:latest
    container_name: wardrobe-admin
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: sqlite+aiosqlite:////app/data/wardrobe.db
    command: ["python", "-m", "app.admin.web"]
    ports:
      # Только loopback VPS: наружу не торчит. Для доступа — SSH-туннель.
      - "127.0.0.1:8080:8080"
    volumes:
      - wardrobe_data:/app/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  wardrobe_data:
  hf_cache:
